<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#e11d48" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Tactical Emergency Shield -->
  <path d="M 256 64 C 330 64 400 90 416 140 C 416 270 348 376 256 448 C 164 376 96 270 96 140 C 112 90 182 64 256 64 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#glow)"/>

  <!-- Inner Shield Trim -->
  <path d="M 256 86 C 316 86 374 108 388 150 C 388 256 332 346 256 410 C 180 346 124 256 124 150 C 138 108 196 86 256 86 Z" 
        fill="#020617" 
        fill-opacity="0.6"/>

  <!-- High-Tech Vital Pulse & Star of Life Line -->
  <path d="M 150 256 L 210 256 L 235 186 L 265 326 L 290 226 L 310 276 L 330 256 L 362 256" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Top Radio Telemetry Beacon -->
  <circle cx="256" cy="144" r="14" fill="#38bdf8"/>
  <path d="M 226 130 C 242 118 270 118 286 130" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <path d="M 206 116 C 234 98 278 98 306 116" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-opacity="0.6"/>
</svg>
