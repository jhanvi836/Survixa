<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Emergency Mode | Survixa</title>
  <meta name="theme-color" content="#e11d48">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #020617;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 1.25rem;
      padding: 2.5rem 1.75rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .beacon {
      width: 4.5rem;
      height: 4.5rem;
      border-radius: 9999px;
      background: rgba(225, 29, 72, 0.15);
      border: 2px solid #e11d48;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem auto;
      animation: pulse 2s infinite;
    }
    .beacon svg {
      width: 2.25rem;
      height: 2.25rem;
      fill: #f43f5e;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.6); }
      70% { box-shadow: 0 0 0 20px rgba(225, 29, 72, 0); }
      100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      color: #ffffff;
      letter-spacing: -0.025em;
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-family: monospace;
      font-weight: 700;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background-color: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
      margin-bottom: 1.25rem;
    }
    p {
      font-size: 0.875rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }
    .btn-emergency {
      display: block;
      width: 100%;
      padding: 0.875rem 1.25rem;
      background: linear-gradient(135deg, #e11d48, #be123c);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      border-radius: 0.75rem;
      transition: all 0.2s ease;
      box-shadow: 0 10px 15px -3px rgba(225, 29, 72, 0.4);
      margin-bottom: 0.75rem;
    }
    .btn-emergency:hover {
      background: linear-gradient(135deg, #f43f5e, #e11d48);
      transform: translateY(-1px);
    }
    .btn-retry {
      display: block;
      width: 100%;
      padding: 0.75rem 1.25rem;
      background-color: #1e293b;
      color: #cbd5e1;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 0.75rem;
      border: 1px solid #334155;
      cursor: pointer;
    }
    .btn-retry:hover {
      background-color: #334155;
      color: #ffffff;
    }
    .footer {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #64748b;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="beacon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5zm0 18c-3.75-1-6.72-4.59-7-8.73V8.3l7-3.89 7 3.89v4.97c-.28 4.14-3.25 7.73-7 8.73zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
      </svg>
    </div>

    <span class="badge">OFFLINE EMERGENCY RESILIENCE</span>
    <h1>Weak or Lost Cellular Signal</h1>
    <p>
      Survixa's offline disaster caching is actively protecting your connection. Even with zero bars of signal, you can still submit life-saving distress reports.
    </p>

    <a href="/report" class="btn-emergency">Access Citizen Emergency Intake &rarr;</a>
    <button onclick="window.location.reload()" class="btn-retry">Check Connection & Retry</button>

    <div class="footer">
      SURVIXA PWA v1.0 &bull; AUTO-SYNC ENGAGED
    </div>
  </div>
</body>
</html>
